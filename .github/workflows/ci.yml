# The gate. One job, running the same `verify` script the pre-push hook runs —
# re-listing the individual checks here would be a second definition of
# "everything" to keep in sync, and this is the copy that would drift.
#
# Three jobs.
#
# `node` installs no .NET at all, on purpose: the TypeScript half must be buildable
# and testable without an SDK, because that is the promise made to consumers, and
# this is where the claim gets tested rather than assumed. The oracle-dependent
# tests skip there, which is correct — there is genuinely no oracle.
#
# `oracle` is the .NET half: locked restore, xunit, and the diagnostic snapshot.
#
# `integration` has both and runs the two halves against each other. It exists so
# the skips in `node` are never the only outcome anywhere: every test in the suite
# actually runs in exactly one of these jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three, because binary resolution is the most platform-fragile code in
        # the package: path handling, the Windows `.exe` suffix, and the cache
        # location all differ, and the Windows failure mode in particular is silent —
        # an extensionless path never resolves there and validation turns itself off.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm run build

      - run: pnpm run docs:check
        if: matrix.os == 'ubuntu-latest'

  oracle:
    name: oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Locked mode, not a convenience flag: without it the lock file is a
      # suggestion, and a transitive bump can move the validation baseline for every
      # consumer of this package with nothing in any diff to show for it. This step
      # failing means the lock file and the project disagree — regenerate it in the
      # PR that caused it. See docs/sdk-pin.md.
      - run: dotnet restore oracle/OoxmlValidator.csproj --locked-mode
      - run: dotnet restore oracle.tests/OoxmlValidator.Tests.csproj --locked-mode

      - run: dotnet build oracle.tests/OoxmlValidator.Tests.csproj --no-restore
      - run: dotnet test oracle.tests/OoxmlValidator.Tests.csproj --no-build

      # The snapshot test above already fails on a moved diagnostic. This makes the
      # *other* failure mode loud: a run that rewrote the snapshot and left the
      # working tree dirty, which would otherwise pass silently.
      - run: git diff --exit-code -- fixtures/

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: pnpm install --frozen-lockfile
      - run: pnpm run oracle:build

      # Pointed at the source build rather than a downloaded release: this job tests
      # the package against the oracle *in this commit*, which is the pairing a
      # release will ship. The download path is covered separately — it needs a
      # published release to download.
      - run: pnpm test
        env:
          OOXML_VALIDATOR_BIN: ${{ github.workspace }}/oracle/bin/Release/net10.0/ooxml-validator

  # The one path a source build can never exercise: resolving, downloading,
  # checksumming, attesting and extracting a real published binary. It is also the
  # most platform-fragile code in the package — the Windows `.exe` suffix and macOS's
  # quarantine and ad-hoc signing are each a silent failure on exactly one OS — so it
  # runs on all three.
  released:
    name: released binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The package resolves the release tagged with its own version, deliberately —
      # one number, no resolution matrix. So between the commit that bumps the version
      # and the tag that releases it, there is genuinely nothing to download.
      #
      # That window is real, bounded, and self-clearing, which is why it is reported
      # rather than treated as a failure. It is NOT the same as "the binary could not
      # be obtained", which stays fatal below: this checks that the release is absent
      # for the one reason that is legitimate, and having established that, expects
      # everything afterwards to work.
      - name: Is there a release for this version yet?
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "${tag}" --json tagName > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no release ${tag} yet — tag it to exercise the download path"
          fi

      - name: Resolve, verify and run a real released binary
        if: steps.release.outputs.exists == 'true'
        shell: bash
        env:
          # `gh attestation verify` queries GitHub's attestation API, which needs a
          # token. Provenance verification fails closed, so without this the step
          # would fail — which is the correct direction, but for the wrong reason.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import {resolveValidator} from "./src/resolve.ts";
            import {validate} from "./src/validate.ts";
            import {oracleVersion} from "./src/run.ts";
            import {PACKAGE_VERSION} from "./src/version.ts";

            const binary = await resolveValidator();
            console.log("resolved:", binary);

            // One number: the binary a given package version resolves must be the
            // binary built for that version. A mismatch here means the release and
            // the package disagree about what they are.
            const {tool} = await oracleVersion();
            if (tool !== PACKAGE_VERSION) {
              throw new Error(`binary reports ${tool}, package is ${PACKAGE_VERSION}`);
            }

            const report = await validate(["fixtures/clean.pptx", "fixtures/dirty.pptx"]);
            const byFile = new Map(report.results.map((r) => [r.file, r]));
            if (!byFile.get("fixtures/clean.pptx").valid) throw new Error("clean fixture reported invalid");
            if (byFile.get("fixtures/dirty.pptx").valid) throw new Error("dirty fixture reported valid");
            console.log("released binary validates correctly at", report.format, report.sdkVersion);
          '

      # Second run, same job: the cache must now satisfy resolution with the network
      # forbidden. A download on every call would be a ~40 MB fetch per test run and
      # nobody would notice until CI got slow.
      - name: The second resolution must not touch the network
        if: steps.release.outputs.exists == 'true'
        shell: bash
        env:
          OOXML_VALIDATOR_NO_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import {resolveValidator} from "./src/resolve.ts";
            console.log("cached:", await resolveValidator());
          '

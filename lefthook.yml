# Git hooks, managed by lefthook. Installed automatically on `pnpm install` by the
# `prepare` script — except where `core.hooksPath` points outside this repo, which
# scripts/install-hooks.ts reports and steps around rather than failing the install.
# These mirror the CI gates so a failure surfaces locally instead of on the runner.
#
# Bypass when you genuinely must: `git commit --no-verify` / `git push --no-verify`,
# or `LEFTHOOK=0 git …` to disable all hooks.
#
# Both jobs run their tool as `node <file>`, never through `pnpm exec` or a
# `node_modules/.bin` shim: `pnpm exec` re-verifies the whole dependency tree before
# the tool sees an argument, which is real overhead on every single invocation.

# Commit-message rules shared across every repo here, so the regex has one
# definition rather than one copy per project. Lefthook fetches this on `install`
# and caches it under .git/info/lefthook-remotes/; refetch_frequency is what lets
# a fix in the shared repo ever arrive. The tag is pinned on purpose — a branch
# would mean any push there changes what this repo runs.
#
# Jobs merge rather than override, so adding a local commit-msg job later does
# not displace this one.
remotes:
  - git_url: https://github.com/shbernal/lefthook-rules
    ref: v1
    configs:
      - rules/no-ai-attribution.yml
    refetch_frequency: 24h

# Fast, staged-scoped: format + lint only what you're committing, and re-stage any
# autofixes so the commit is always Biome-clean.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,js,mjs,cjs,json,jsonc}"
      run: node node_modules/@biomejs/biome/bin/biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

# Full gate, mirroring .github/workflows/ci.yml. Runs on the whole tree (not just
# staged files) because a push may carry commits made with --no-verify.
#
# One job, because package.json's `verify` script already defines the gate set.
# Re-listing the gates here would be a second definition of "everything" to keep in
# sync — and the one that silently drifts, since a hook is the copy nobody reads.
pre-push:
  jobs:
    - name: verify
      run: pnpm run verify
